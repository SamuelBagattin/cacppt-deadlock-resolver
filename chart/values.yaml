image:
  repository: ghcr.io/samuelbagattin/cacppt-deadlock-resolver
  tag: ""
  pullPolicy: IfNotPresent

env:
  POLL_INTERVAL: "20"
  STUCK_THRESHOLD: "120"
  DRY_RUN: "false"

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 64Mi

securityContext:
  runAsNonRoot: true
  runAsUser: 65534
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

livenessProbe:
  httpGet:
    path: /healthz
    port: health
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /readyz
    port: health
  initialDelaySeconds: 5
  periodSeconds: 10

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: true

replicaCount: 1

nodeSelector: {}
tolerations: []
affinity: {}
