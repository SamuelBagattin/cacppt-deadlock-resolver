apiVersion: v1
kind: ServiceAccount
metadata:
  name: cacppt-deadlock-resolver
  namespace: cacppt-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cacppt-deadlock-resolver
rules:
  # Read TalosControlPlane resources
  - apiGroups: ["controlplane.cluster.x-k8s.io"]
    resources: ["taloscontrolplanes"]
    verbs: ["get", "list", "watch"]
  # Read + delete Machine resources
  - apiGroups: ["cluster.x-k8s.io"]
    resources: ["machines"]
    verbs: ["get", "list", "watch", "delete"]
  # Read talosconfig secrets (for talosctl access to workload clusters)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cacppt-deadlock-resolver
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cacppt-deadlock-resolver
subjects:
  - kind: ServiceAccount
    name: cacppt-deadlock-resolver
    namespace: cacppt-system
